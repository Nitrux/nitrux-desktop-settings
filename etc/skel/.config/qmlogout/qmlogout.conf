# Default values for QMLogout
# qmlogout.conf 2026 (c) Nitrux Latinoamericana S.C.

[Appearance]
OverlayOpacity=0.76
IconMode=system
# Leave empty to try ~/.face, ~/.face.icon, AccountsService, then the embedded avatar.
# Supports %u for the current username and %h for the current home directory.
AvatarImage=

[SystemUptime]
ShowUptime=true

[Session]
ActionTimeout=120
