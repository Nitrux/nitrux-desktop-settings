# Default values for Desklock
# qmlgreet.conf 2026 (c) Nitrux Latinoamericana S.C.

[Appearance]
BackgroundImage=/usr/share/wallpapers/Aqua/contents/images/2560x1440.png
BackgroundBlurRadius=64
BlurEnabled=true
OverlayEnabled=true
OverlayOpacity=0.76
IconMode=nerd
# Leave empty to try ~/.face, ~/.face.icon, AccountsService, then the embedded avatar.
# Supports %u for the current username and %h for the current home directory.
AvatarImage=

[Clock]
TimeFormat=hh:mm
DateFormat=dddd, dd MMMM yyyy
LowercaseDate=false

[Battery]
Enabled=true
UpdateInterval=30000

[Media]
Enabled=true

[SystemMonitor]
Enabled=true
UpdateInterval=3000

[Debug]
# Show a dummy battery indicator and cycle through battery states (true/false)
debugBattery=false

[Behavior]
HideCursor=false
